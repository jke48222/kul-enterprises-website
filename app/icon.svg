<!--
  KUL Enterprises favicon, ink tile, gold K.

  Replaces a 1,003,078-byte auto-trace of the photoreal lion mark that was
  requested on every page load. A favicon renders at 16-32px, where the
  lion's mane detail collapses into a gold smudge, so the mark here is the
  wordmark's initial instead: the same letterform register as the nav
  lockup (components/v2/Nav.tsx), in brand gold (#B59352) on ink (#0B0B0B).
  On dark browser chrome the tile recedes and the K carries the mark alone.

  Two filled paths, no strokes and no gradients, so it rasterizes cleanly at
  every size a browser asks for. The lion stays the site's mark everywhere
  it has the room to read.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <path d="M21 0H79A21 21 0 0 1 100 21V79A21 21 0 0 1 79 100H21A21 21 0 0 1 0 79V21A21 21 0 0 1 21 0Z" fill="#0B0B0B"/>
  <path d="M21.5 22.6H36.3V43.2L56.8 22.6H75.1L50 50.6L78.5 77.4H57.4L36.3 58V77.4H21.5Z" fill="#B59352"/>
</svg>
